      description: |
        Con `custom`, `items` es la lista marcada por el usuario (mín. 1). Con otro preset,
        `items` va vacío en la entrada y el motor lo resuelve con los presets de
        `specs/equipment-normalization.yaml`; en `ProgramPlan.input` aparece ya resuelto.
