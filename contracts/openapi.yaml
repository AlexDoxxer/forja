        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de planes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealPlanPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [nutrition]
      operationId: generateMealPlan
      summary: Genera el plan semanal de comidas
      description: |
        Si un bloqueo de seguridad impide generar el plan, responde `422` con
        `code = nutrition_blocked` y la extensión `block` (motivo y mensaje de derivación).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealPlanCreate" }
            example: { week_start: "2026-09-28", seed: null }
      responses:
        "201":
          description: Plan generado.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealPlanResource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /nutrition/plans/{plan_id}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      tags: [nutrition]
      operationId: getMealPlan
      summary: Plan de comidas
      responses:
        "200":
          description: Plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealPlanResource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /nutrition/plans/{plan_id}/swap:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      tags: [nutrition]
      operationId: swapMealPlanFood
      summary: Intercambia un alimento dentro de su categoría conservando los macros de la comida
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealSwapRequest" }
      responses:
        "200":
          description: Plan actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealPlanResource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /nutrition/plans/{plan_id}/shopping-list:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      tags: [nutrition]
      operationId: getShoppingList
      summary: Lista de la compra semanal agregada por categoría
      responses:
        "200":
          description: Lista de la compra.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /foods:
    get:
      tags: [nutrition]
      operationId: listFoods
      summary: Base de alimentos (búsqueda sin acentos por nombre en español)
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
          example: garbanzos
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/FoodCategory" }
        - name: diet_type
          in: query
          description: Solo alimentos compatibles con este tipo de dieta.
          schema: { $ref: "#/components/schemas/DietType" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de alimentos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FoodPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # -------------------------------------------------------------------- data
  /me/export:
    get:
      tags: [data]
      operationId: exportAccountData
      summary: Copia completa de los datos del usuario en JSON
      responses:
        "200":
          description: Exportación completa.
          headers:
            Content-Disposition: { $ref: "#/components/headers/ContentDispositionAttachment" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/import:
    post:
      tags: [data]
      operationId: importAccountData
      summary: Importa una exportación de Forja (fusión idempotente, máx. 5 MB)
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserExport" }
      responses:
        "200":
          description: Resultado de la importación.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /me:
    delete:
      tags: [data]
      operationId: deleteAccount
      summary: Borra la cuenta y todos sus datos (requiere la contraseña)
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountDeleteRequest" }
      responses:
        "204":
          description: Cuenta eliminada y cookies borradas.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ------------------------------------------------------------------- admin
  /admin/settings:
    get:
      tags: [admin]
      operationId: getAdminSettings
      summary: Ajustes globales
      responses:
        "200":
          description: Ajustes globales.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      operationId: updateAdminSettings
      summary: Sustituye los ajustes globales editables
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSettingsUpdate" }
      responses:
        "200":
          description: Ajustes actualizados (queda registro en `audit_log`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Usuarios
      parameters:
        - name: q
          in: query
          description: Filtro por email o nombre visible.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de usuarios.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [admin]
      operationId: updateUser
      summary: Cambia rol o activa/desactiva un usuario
      description: No se puede degradar ni desactivar al último administrador activo (`409`).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
      responses:
        "200":
          description: Usuario actualizado (queda registro en `audit_log`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/ingest:
    post:
      tags: [admin]
      operationId: startIngest
      summary: Lanza la ingesta del dataset en segundo plano (commit fijado en DATASET_COMMIT)
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestRequest" }
            example: { dry_run: true }
      responses:
        "202":
          description: Ingesta encolada.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/ingest/runs:
    get:
      tags: [admin]
      operationId: listIngestRuns
      summary: Ejecuciones de ingesta (más recientes primero)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de ejecuciones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestRunPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-forja_session
      description: |
        Token opaco aleatorio de 32 bytes (guardado hasheado). Cookie `HttpOnly; Secure;
        SameSite=Lax; Path=/`, expiración deslizante de 30 días (ADR 0003).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Doble envío: debe coincidir con la cookie `__Host-forja_csrf`. Obligatorio en todo
        método no seguro; su ausencia o discrepancia responde `403` con `code = csrf_failed`.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devuelto como `next_cursor` en la página anterior.
      schema: { type: string, minLength: 1, maxLength: 512 }
    Limit:
      name: limit
      in: query
      description: Tamaño de página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    FromDate:
      name: from
      in: query
      description: Fecha inicial inclusiva.
      schema: { type: string, format: date }
    ToDate:
      name: to
      in: query
      description: Fecha final inclusiva.
      schema: { type: string, format: date }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: ETag de una respuesta anterior; si coincide, `304`.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave única por intento lógico (se recomienda el `client_uuid`). Se retiene 24 h.
      schema: { type: string, minLength: 8, maxLength: 128 }
    ExerciseId:
      name: exercise_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ExerciseIdValue" }
    ProgramId:
      name: program_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DayId:
      name: day_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SetId:
      name: set_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: plan_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MetricId:
      name: metric_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuthSessionId:
      name: auth_session_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    ETag:
      description: Validador débil de la representación (versión de catálogo + favoritos).
      schema: { type: string }
      example: 'W/"cat-7455efae-1-fav-12"'
    CacheControlPrivate:
      description: Las respuestas dependen del usuario; solo caché privada con revalidación.
      schema: { type: string, const: "private, no-cache" }
    Location:
      description: URL del recurso creado.
      schema: { type: string, format: uri-reference }
    IdempotentReplayed:
      description: "`true` si la respuesta es la repetición de una petición idempotente previa."
      schema: { type: string, enum: ["true"] }
    RetryAfter:
      description: Segundos que hay que esperar antes de reintentar.
      schema: { type: integer, minimum: 1 }
    ContentDispositionAttachment:
      description: Descarga como fichero (`attachment; filename="..."`).
      schema: { type: string }
      example: 'attachment; filename="forja-programa-hipertrofia.pdf"'
    SetSessionCookie:
      description: |
        `__Host-forja_session=<token>; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=2592000`
        y, además, una cookie `__Host-forja_csrf` nueva (rotación al iniciar sesión).
      schema: { type: string }
    SetCsrfCookie:
      description: "`__Host-forja_csrf=<token>; Path=/; Secure; SameSite=Lax` (sin HttpOnly)."
      schema: { type: string }

  responses:
    NotModified:
      description: La representación no ha cambiado desde el `ETag` indicado.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
    Unauthorized:
      description: Sin sesión válida o credenciales incorrectas.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: /problems/unauthenticated
            title: Necesitas iniciar sesión
            status: 401
            code: unauthenticated
            detail: La sesión ha caducado. Vuelve a iniciar sesión.
            request_id: 01J8Z3M4Q5R6S7T8V9W0X1Y2Z3
    Forbidden:
      description: Autenticado pero sin permiso (rol, CSRF, registro cerrado o dieta desactivada).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: /problems/csrf-failed
            title: Token CSRF no válido
            status: 403
            code: csrf_failed
            detail: Recarga la página e inténtalo de nuevo.
            request_id: 01J8Z3M4Q5R6S7T8V9W0X1Y2Z4
    NotFound:
      description: El recurso no existe o pertenece a otro usuario.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: /problems/not-found
            title: No encontrado
            status: 404
            code: not_found
            detail: El programa solicitado no existe.
            request_id: 01J8Z3M4Q5R6S7T8V9W0X1Y2Z5
    Conflict:
      description: Conflicto con el estado actual del recurso.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: /problems/conflict
            title: Conflicto
            status: 409
            code: session_already_finished
            detail: La sesión ya estaba terminada.
            request_id: 01J8Z3M4Q5R6S7T8V9W0X1Y2Z6
    PayloadTooLarge:
      description: El cuerpo supera el tamaño máximo permitido.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: /problems/payload-too-large
            title: Fichero demasiado grande
            status: 413
            code: payload_too_large
            detail: El tamaño máximo es 5 MB.
    ValidationFailed:
      description: Entrada no válida (esquema, reglas de negocio o del motor).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: /problems/validation-error
            title: Datos no válidos
            status: 422
            code: validation_error
            detail: Revisa los campos marcados.
            errors:
              - loc: [body, session_minutes]
                msg: Debe ser un múltiplo de 5 entre 20 y 120.
                type: multiple_of
            request_id: 01J8Z3M4Q5R6S7T8V9W0X1Y2Z7
    TooManyRequests:
      description: Límite de peticiones superado.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: /problems/rate-limited
            title: Demasiadas peticiones
            status: 429
            code: rate_limited
            detail: Espera un minuto antes de volver a intentarlo.

  schemas:
    # ============================================================ comunes
    Problem:
      type: object
      description: Detalle de error RFC 9457 con extensiones de Forja.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI relativa que identifica el tipo de problema (`/problems/<code-con-guiones>`).
        title: { type: string, description: "Resumen legible en el idioma del usuario." }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: |
            Código estable para el cliente. Valores definidos: validation_error, unauthenticated,
            invalid_credentials, forbidden, csrf_failed, registration_closed, admin_required,
            diet_disabled, not_found, conflict, email_taken, session_already_finished,
            program_not_generated, last_admin, ingest_running, idempotency_key_reused,
            idempotency_in_progress, plan_invalid, nutrition_blocked, payload_too_large,
            import_invalid, rate_limited, service_unavailable.
        request_id: { type: string, description: "Identificador de la petición (cabecera `X-Request-ID`)." }
        errors:
          type: array
          description: Errores de validación por campo (solo con `validation_error`).
          items: { $ref: "#/components/schemas/ValidationIssue" }
        violations:
          type: array
          description: Reglas del motor incumplidas (solo con `plan_invalid`).
          items: { $ref: "#/components/schemas/PlanWarning" }
        block:
          description: Bloqueo de seguridad nutricional (solo con `nutrition_blocked`).
          $ref: "#/components/schemas/NutritionBlock"
      additionalProperties: true
    ValidationIssue:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items: { anyOf: [{ type: string }, { type: integer }] }
          description: Ruta del campo (`["body", "equipment", "items", 0]`).
        msg: { type: string, description: "Mensaje en el idioma del usuario." }
        type: { type: string, description: "Tipo de error estable (`missing`, `too_short`…)." }
    ExerciseIdValue:
      type: string
      pattern: "^[0-9]{4}$"
      description: Id del dataset de origen, cuatro dígitos con ceros a la izquierda.
      examples: ["0043"]
    Weekday:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    ReadinessStatus:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          required: [database, media]
          properties:
            database: { type: boolean }
            media: { type: boolean, description: "`$MEDIA_ROOT/manifest.json` legible." }
    MediaAttribution:
      type: object
      description: Atribución obligatoria de los medios © Gym visual (§2.1). Se muestra siempre debajo del medio.
      required: [text, url]
      properties:
        text: { type: string, const: "© Gym visual" }
        url: { type: string, const: "https://gymvisual.com/" }
    AboutInfo:
      type: object
      required: [app_version, api_version, engine_version, nutrition_version, dataset, licenses, media_attribution, health_disclaimer_es]
      properties:
        app_version: { type: string, examples: ["1.0.0"] }
        api_version: { type: string, examples: ["1.0.0"] }
        engine_version: { type: string, examples: ["1.0.0"] }
        nutrition_version: { type: string, examples: ["1.0.0"] }
        dataset:
          type: object
          required: [repo, commit, ingested_at, exercise_count]
          properties:
            repo: { type: string, format: uri, examples: ["https://github.com/hasaneyldrm/exercises-dataset"] }
            commit: { type: string, pattern: "^[0-9a-f]{40}$", examples: ["7455efae41b330c265e7cd4b78dfa848e7ce5ebd"] }
            ingested_at: { type: [string, "null"], format: date-time }
            exercise_count: { type: integer, minimum: 0, examples: [1324] }
        licenses:
          type: object
          required: [dataset_mit, media_notice]
          properties:
            dataset_mit: { type: string, description: "Texto completo de la licencia MIT del dataset." }
            media_notice: { type: string, description: "Aviso de medios de Gym visual (NOTICE.md del dataset)." }
        media_attribution: { $ref: "#/components/schemas/MediaAttribution" }
        health_disclaimer_es:
          type: string
          examples: ["Forja no sustituye el consejo de profesionales sanitarios ni de entrenamiento."]

    # ============================================================ enumeraciones
    Sex:
      type: string
      enum: [male, female, unspecified]
    Experience:
      type: string
      enum: [beginner, intermediate, advanced]
    Goal:
      type: string
      enum: [strength, hypertrophy, fat_loss, endurance, general_fitness, toning]
    Emphasis:
      type: string
      enum: [balanced, lower_glutes, upper_body, arms, back_posture, core]
    EquipmentPreset:
      type: string
      enum: [full_gym, home_dumbbells, home_bands, bodyweight, custom]
    EquipmentCode:
      type: string
      description: Código canónico de `specs/equipment-normalization.yaml`.
      enum: [bodyweight, dumbbell, cable, barbell, ez_bar, trap_bar, machine, smith, sled, assisted,
        band, kettlebell, weighted, stability_ball, medicine_ball, bosu, rope, roller, ab_wheel,
        hammer, tire, arm_ergometer, skierg, bike, elliptical, stepmill]
    EquipmentGroup:
      type: string
      enum: [gym, home_basic, bodyweight, cardio_machine, other]
    MuscleCode:
      type: string
      description: Código canónico de `specs/muscle-normalization.yaml`.
      enum: [chest, lats, upper_back, traps, lower_back, shoulders, rear_delts, rotator_cuff,
        serratus, biceps, triceps, forearms, abs, obliques, hip_flexors, glutes, quads,
        hamstrings, adductors, abductors, calves, lower_leg, neck, cardio]
    MuscleRegion:
      type: string
      enum: [upper, lower, core, cardio, other]
    VolumeGroup:
      type: string
      description: Grupos que computan volumen semanal (`specs/volume-targets.yaml`).
      enum: [chest, back, shoulders, arms, quads, hamstrings, glutes, calves, core]
    MuscleGroup:
