        max_portion_g: { type: number, exclusiveMinimum: 0, description: "Tope de gramos por ítem en un plan." }
        meal_slots: { type: array, uniqueItems: true, items: { $ref: "#/components/schemas/MealSlot" }, description: "Comidas donde puede seleccionarse; vacío = no se selecciona automáticamente." }
        weekly_max: { type: [integer, "null"], minimum: 1, description: "Máximo de apariciones por semana; `null` sin límite." }
      example:
        id: garbanzos_cocidos
        name_es: garbanzos cocidos
        category: legumes
        fdc_id: 173757
        per_100g: { kcal: 164, protein_g: 8.9, fat_g: 2.6, carbs_g: 27.4, fiber_g: 7.6 }
        diet_types: [omnivore, pescatarian, vegetarian, vegan]
        allergens: []
        macro_role: carb
        typical_portion_g: 150
        unit_grams: null
        unit_name_es: null
        energy_note: null
        max_portion_g: 300
        meal_slots: [lunch, dinner]
        weekly_max: null
    FoodPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Food" } }
        next_cursor: { type: [string, "null"] }
    MealItem:
      type: object
      required: [food_id, name_es, grams, units, nutrients]
      properties:
        food_id: { $ref: "#/components/schemas/FoodId" }
        name_es: { type: string }
        grams: { type: number, exclusiveMinimum: 0, description: "Múltiplo de 5 g salvo alimentos por unidades." }
        units: { type: [integer, "null"], minimum: 1, description: "Unidades para alimentos contables." }
        nutrients: { $ref: "#/components/schemas/MacroTotals" }
    Meal:
      type: object
      required: [slot, items, totals]
      properties:
        slot: { $ref: "#/components/schemas/MealSlot" }
        items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/MealItem" } }
        totals: { $ref: "#/components/schemas/MacroTotals" }
    MacroDeviation:
      type: object
      description: Desviación relativa respecto al objetivo (0,03 = +3 %).
      required: [kcal, protein, fat, carbs]
      properties:
        kcal: { type: number }
        protein: { type: number }
        fat: { type: number }
        carbs: { type: number }
    MealPlanDay:
      type: object
      required: [day_index, date, meals, totals, deviation]
      properties:
        day_index: { type: integer, minimum: 0, maximum: 6 }
        date: { type: string, format: date }
        meals: { type: array, minItems: 3, maxItems: 5, items: { $ref: "#/components/schemas/Meal" } }
        totals: { $ref: "#/components/schemas/MacroTotals" }
        deviation: { $ref: "#/components/schemas/MacroDeviation" }
    MealPlan:
      type: object
      description: Salida del motor de nutrición (§8.3). Determinista con la misma semilla y base de alimentos.
      required: [nutrition_version, foods_hash, seed, week_start, diet_type, meals_per_day, target, days, notices]
      properties:
        nutrition_version: { type: string, examples: ["1.0.0"] }
        foods_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        seed: { type: integer, minimum: 0, maximum: 9007199254740991 }
        week_start: { type: string, format: date }
        diet_type: { $ref: "#/components/schemas/DietType" }
        meals_per_day: { type: integer, minimum: 3, maximum: 5 }
        target: { $ref: "#/components/schemas/NutritionTarget" }
        days: { type: array, minItems: 7, maxItems: 7, items: { $ref: "#/components/schemas/MealPlanDay" } }
        notices: { type: array, items: { $ref: "#/components/schemas/NutritionNotice" } }
    MealPlanCreate:
      type: object
      required: [week_start]
      additionalProperties: false
      properties:
        week_start: { type: string, format: date, description: "Lunes de la semana del plan." }
        seed: { type: [integer, "null"], minimum: 0, maximum: 9007199254740991 }
    MealPlanResource:
      type: object
      required: [id, created_at, updated_at, plan]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        plan: { $ref: "#/components/schemas/MealPlan" }
    MealPlanSummary:
      type: object
      required: [id, week_start, diet_type, meals_per_day, target_kcal, created_at]
      properties:
        id: { type: string, format: uuid }
        week_start: { type: string, format: date }
        diet_type: { $ref: "#/components/schemas/DietType" }
        meals_per_day: { type: integer, minimum: 3, maximum: 5 }
        target_kcal: { type: number }
        created_at: { type: string, format: date-time }
    MealPlanPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MealPlanSummary" } }
        next_cursor: { type: [string, "null"] }
    MealSwapRequest:
      type: object
      required: [day_index, meal, food_id, replacement_food_id]
      additionalProperties: false
      properties:
        day_index: { type: integer, minimum: 0, maximum: 6 }
        meal: { $ref: "#/components/schemas/MealSlot" }
        food_id: { $ref: "#/components/schemas/FoodId" }
        replacement_food_id:
          description: Alimento elegido (misma categoría); `null` ⇒ el motor elige.
          anyOf: [{ $ref: "#/components/schemas/FoodId" }, { type: "null" }]
    ShoppingItem:
      type: object
      required: [food_id, name_es, total_grams, units]
      properties:
        food_id: { $ref: "#/components/schemas/FoodId" }
        name_es: { type: string }
        total_grams: { type: number, minimum: 0 }
        units: { type: [integer, "null"], minimum: 1 }
    ShoppingCategory:
      type: object
      required: [category, label_es, items]
      properties:
        category: { $ref: "#/components/schemas/FoodCategory" }
        label_es: { type: string, examples: [Legumbres] }
        items: { type: array, items: { $ref: "#/components/schemas/ShoppingItem" } }
    ShoppingList:
      type: object
      required: [plan_id, week_start, categories]
      properties:
        plan_id: { type: string, format: uuid }
        week_start: { type: string, format: date }
        categories: { type: array, items: { $ref: "#/components/schemas/ShoppingCategory" } }

    # ============================================================ datos de usuario
    UserExport:
      type: object
      description: Copia completa y reimportable de los datos del usuario (sin contraseña ni sesiones).
      required: [format, schema_version, exported_at, app_version, user, profile, body_metrics, favorites, programs, sessions, personal_records, nutrition]
      additionalProperties: false
      properties:
        format: { type: string, const: forja-export }
        schema_version: { type: integer, const: 1 }
        exported_at: { type: string, format: date-time }
        app_version: { type: string }
        user:
          type: object
          required: [email, display_name, locale, units, created_at]
          properties:
            email: { type: string, format: email }
            display_name: { type: string }
            locale: { $ref: "#/components/schemas/Locale" }
            units: { $ref: "#/components/schemas/Units" }
            created_at: { type: string, format: date-time }
        profile: { $ref: "#/components/schemas/Profile" }
        parq_answers: { anyOf: [{ $ref: "#/components/schemas/ParqAnswers" }, { type: "null" }] }
        body_metrics: { type: array, items: { $ref: "#/components/schemas/BodyMetric" } }
        favorites: { type: array, items: { $ref: "#/components/schemas/ExerciseIdValue" } }
        programs: { type: array, items: { $ref: "#/components/schemas/ProgramDetail" } }
        sessions: { type: array, items: { $ref: "#/components/schemas/WorkoutSession" } }
        personal_records: { type: array, items: { $ref: "#/components/schemas/PersonalRecord" } }
        nutrition:
          type: object
          required: [settings, targets, plans]
          properties:
            settings: { anyOf: [{ $ref: "#/components/schemas/NutritionSettingsUpdate" }, { type: "null" }] }
            targets: { type: array, items: { $ref: "#/components/schemas/NutritionTargetRecord" } }
            plans: { type: array, items: { $ref: "#/components/schemas/MealPlanResource" } }
    ImportCounts:
      type: object
      required: [programs, sessions, sets, body_metrics, favorites, meal_plans]
      properties:
        programs: { type: integer, minimum: 0 }
        sessions: { type: integer, minimum: 0 }
        sets: { type: integer, minimum: 0 }
        body_metrics: { type: integer, minimum: 0 }
        favorites: { type: integer, minimum: 0 }
        meal_plans: { type: integer, minimum: 0 }
    ImportResult:
      type: object
      description: "Los programas importados quedan con `source = imported` e inactivos; sesiones y series se deduplican por `client_uuid`."
      required: [created, skipped, warnings]
      properties:
        created: { $ref: "#/components/schemas/ImportCounts" }
        skipped: { $ref: "#/components/schemas/ImportCounts" }
        warnings: { type: array, items: { type: string } }
    AccountDeleteRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, minLength: 1, maxLength: 256 }

    # ============================================================ administración
    AdminSettingsFields:
      description: Ajustes globales editables.
      type: object
      required: [registration_open, diet_feature_enabled]
      properties:
        registration_open: { type: boolean }
        diet_feature_enabled: { type: boolean }
    AdminSettingsUpdate:
      allOf:
        - $ref: "#/components/schemas/AdminSettingsFields"
      unevaluatedProperties: false
    AdminSettings:
      allOf:
        - $ref: "#/components/schemas/AdminSettingsFields"
        - type: object
          required: [media_require_auth, dataset_commit]
          properties:
            media_require_auth: { type: boolean, readOnly: true, description: "Efectivo, de `MEDIA_REQUIRE_AUTH` (solo lectura)." }
            dataset_commit: { type: string, pattern: "^[0-9a-f]{40}$", readOnly: true }
    AdminUser:
      type: object
      required: [id, email, display_name, role, is_active, created_at, last_login_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }
    AdminUserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        next_cursor: { type: [string, "null"] }
    AdminUserUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/UserRole" }
        is_active: { type: boolean, description: "`false` revoca todas sus sesiones." }
    IngestRequest:
      type: object
      required: [dry_run]
      additionalProperties: false
      properties:
        dry_run: { type: boolean, description: "Solo calcula el diff (altas/bajas/cambios) sin escribir." }
    IngestCounts:
      type: object
      required: [exercises_total, added, updated, deprecated, unchanged, media_verified]
      properties:
        exercises_total: { type: integer, minimum: 0 }
        added: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        deprecated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        media_verified: { type: integer, minimum: 0, description: "Ficheros de medios con SHA-256 verificado (2.648 esperados)." }
    IngestDiff:
      type: object
      required: [added, updated, deprecated]
      properties:
        added: { type: array, items: { $ref: "#/components/schemas/ExerciseIdValue" } }
        updated: { type: array, items: { $ref: "#/components/schemas/ExerciseIdValue" } }
        deprecated: { type: array, items: { $ref: "#/components/schemas/ExerciseIdValue" } }
    IngestRun:
      type: object
      required: [id, status, dry_run, commit, started_at, finished_at, triggered_by, counts, diff, errors, warnings]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/IngestStatus" }
        dry_run: { type: boolean }
        commit: { type: string, pattern: "^[0-9a-f]{40}$" }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        triggered_by: { type: [string, "null"], format: uuid, description: "Admin que la lanzó; `null` si fue por CLI." }
        counts: { anyOf: [{ $ref: "#/components/schemas/IngestCounts" }, { type: "null" }] }
        diff: { anyOf: [{ $ref: "#/components/schemas/IngestDiff" }, { type: "null" }] }
        errors: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
      example:
        id: 0192f0d0-3333-7c4d-8e5f-60718293a4b5
        status: succeeded
        dry_run: false
        commit: 7455efae41b330c265e7cd4b78dfa848e7ce5ebd
        started_at: "2026-09-20T08:00:00Z"
        finished_at: "2026-09-20T08:03:12Z"
        triggered_by: 0192f08a-3b4c-7d5e-8f60-112233445566
        counts: { exercises_total: 1324, added: 1324, updated: 0, deprecated: 0, unchanged: 0, media_verified: 2648 }
        diff: { added: ["0001", "0002"], updated: [], deprecated: [] }
        errors: []
        warnings: []
    IngestRunPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/IngestRun" } }
        next_cursor: { type: [string, "null"] }
