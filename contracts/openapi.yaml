      maxLength: 64
      examples: [garbanzos_cocidos]
    Food:
      type: object
      required: [id, name_es, category, fdc_id, per_100g, diet_types, allergens, macro_role, typical_portion_g, unit_grams, unit_name_es, energy_note, max_portion_g, meal_slots, weekly_max]
