        weight_kg: { type: [number, "null"] }
        reps: { type: [integer, "null"] }
        achieved_at: { type: string, format: date-time }
        session_id: { type: string, format: uuid }
        set_id: { type: [string, "null"], format: uuid }
      example:
        id: 0192f0b0-1111-7a2b-8c3d-4e5f60718293
        exercise_id: "0043"
