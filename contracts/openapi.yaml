        per_100g: { $ref: "#/components/schemas/MacroTotals" }
        diet_types: { type: array, uniqueItems: true, minItems: 1, items: { $ref: "#/components/schemas/DietType" } }
        allergens: { type: array, uniqueItems: true, items: { $ref: "#/components/schemas/Allergen" } }
        macro_role: { $ref: "#/components/schemas/FoodMacroRole" }
        typical_portion_g: { type: number, exclusiveMinimum: 0 }
        unit_grams: { type: [number, "null"], exclusiveMinimum: 0, description: "Gramos por unidad (huevos, frutas…); `null` si se pesa." }
        unit_name_es: { type: [string, "null"], examples: [huevo] }
        energy_note:
          type: [string, "null"]
