openapi: 3.1.0
info:
  title: Forja API
  version: 1.2.0
  summary: API de Forja, app de entrenamiento autoalojada.
  description: |
    Contrato de la API de Forja (fuente de verdad, MASTER_PROMPT §9). Lo consumen el cliente
    generado (`openapi-typescript` + `openapi-fetch`) y los mocks MSW del frontend; el backend
    exporta su propio esquema y un test de contrato en CI lo compara con este fichero.

    ## Convenciones (ADR 0009)
    - JSON en `snake_case`; fechas ISO 8601 (`date`) y marcas de tiempo en UTC (`date-time`).
    - Identificadores UUID v7, salvo los ejercicios, que conservan el id del dataset (`"0001"`).
    - Errores RFC 9457 (`application/problem+json`, esquema `Problem`) con `code` estable.
    - Listados paginados por cursor opaco: `?cursor=&limit=` (máx. 100) y respuesta
      `{items, next_cursor}`; `next_cursor = null` indica la última página.
    - Autenticación por cookie de sesión `__Host-forja_session` (HttpOnly, Secure, SameSite=Lax).
    - CSRF por doble envío: cookie `__Host-forja_csrf` (legible por JS) + cabecera
      `X-CSRF-Token` con el mismo valor en todo método no seguro (POST, PUT, PATCH, DELETE).
      `GET /auth/csrf` emite la cookie antes del inicio de sesión.
    - Catálogo con `ETag` (débil, depende de la versión del catálogo y de los favoritos del
      usuario) y `If-None-Match` ⇒ `304`.
    - `Idempotency-Key` obligatorio en `POST /sessions` y `POST /sessions/{session_id}/sets`:
      misma clave y mismo cuerpo ⇒ se repite la respuesta original con
      `Idempotent-Replayed: true`; misma clave con otro cuerpo ⇒ `422`
      (`code = idempotency_key_reused`); petición concurrente con la misma clave ⇒ `409`.
    - Autorización por propietario: un recurso de otro usuario responde `404`, nunca `403`.
    - Los medios de ejercicio son © Gym visual: toda vista que muestre `media` DEBE mostrar
      `media.attribution` (MASTER_PROMPT §2.1).
    - Los ejemplos son ilustrativos (los `media_id` de las rutas de medios no son reales);
      los mocks MSW los usan tal cual.
  contact:
    name: Proyecto Forja
servers:
  - url: /api/v1
    description: Mismo origen que la SPA, detrás de nginx.
security:
  - sessionCookie: []
tags:
  - name: health
    description: Vida y disponibilidad del servicio.
  - name: auth
    description: Registro, inicio de sesión, sesiones activas y CSRF.
  - name: profile
    description: Perfil, PAR-Q y métricas corporales.
  - name: catalog
    description: Biblioteca de ejercicios, facetas y favoritos.
  - name: generator
    description: Generación de programas con el motor de rutinas (sin persistir).
  - name: programs
    description: Programas guardados, edición, activación y exportación.
  - name: sessions
    description: Sesiones de entrenamiento, series y sincronización offline.
  - name: stats
    description: Progreso, volumen y récords personales.
  - name: nutrition
    description: Módulo opcional de dieta.
  - name: data
    description: Exportación, importación y borrado de la cuenta.
  - name: admin
    description: Administración (solo rol admin).
  - name: meta
    description: Información de versión, dataset y licencias.

paths:
  # ------------------------------------------------------------------ health
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Comprobación de vida
      security: []
      responses:
        "200":
          description: El proceso está vivo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: ok }
  /ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Disponibilidad (base de datos y medios)
      security: []
      responses:
        "200":
          description: Listo para servir tráfico.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessStatus" }
              example: { status: ready, checks: { database: true, media: true } }
        "503":
          description: Alguna dependencia no está disponible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessStatus" }
              example: { status: not_ready, checks: { database: true, media: false } }

  /about:
    get:
      tags: [meta]
      operationId: getAbout
      summary: Versiones, dataset ingerido y licencias (pantalla «Créditos»)
      security: []
      responses:
        "200":
          description: Información de créditos y licencias.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AboutInfo" }

  # -------------------------------------------------------------------- auth
  /auth/csrf:
    get:
      tags: [auth]
      operationId: issueCsrfToken
      summary: Emite la cookie CSRF (necesaria antes de registro o inicio de sesión)
      security: []
      responses:
        "204":
          description: Cookie `__Host-forja_csrf` emitida o renovada.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCsrfCookie" }
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Registro de usuario (si está habilitado; el primer usuario es admin)
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
            example:
              email: lucia@example.org
              password: "brasa-y-yunque-2026"
              display_name: Lucía
              locale: es
      responses:
        "201":
          description: Usuario creado y sesión iniciada.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicio de sesión (rota la sesión y el token CSRF)
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { email: lucia@example.org, password: "brasa-y-yunque-2026" }
      responses:
        "200":
          description: Sesión iniciada.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cierra la sesión actual
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Sesión revocada y cookies eliminadas.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Usuario autenticado
      responses:
        "200":
          description: Usuario actual.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Cambia la contraseña y revoca las demás sesiones
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "204":
          description: Contraseña cambiada.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/check:
    get:
      tags: [auth]
      operationId: checkSession
      summary: Comprobación para `auth_request` de nginx (sin cuerpo, muy rápida)
      responses:
        "204":
          description: Sesión válida.
        "401":
          description: Sin sesión válida (sin cuerpo).
  /auth/sessions:
    get:
      tags: [auth]
      operationId: listAuthSessions
      summary: Sesiones activas del usuario
      responses:
        "200":
          description: Sesiones activas (no revocadas ni caducadas).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/sessions/{auth_session_id}:
    parameters:
      - $ref: "#/components/parameters/AuthSessionId"
    delete:
      tags: [auth]
      operationId: revokeAuthSession
      summary: Revoca una sesión activa
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Sesión revocada.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ----------------------------------------------------------------- profile
  /profile:
    get:
      tags: [profile]
      operationId: getProfile
      summary: Perfil del usuario
      responses:
        "200":
          description: Perfil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [profile]
      operationId: updateProfile
      summary: Sustituye el perfil (edición completa)
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: Perfil actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /profile/parq:
    put:
      tags: [profile]
      operationId: submitParq
      summary: Registra el cuestionario de aptitud (PAR-Q)
      description: |
        Si alguna respuesta es «sí» se marca `parq_flagged`, se registra el aviso y el nivel
        pasa a `beginner` (el usuario puede cambiarlo después de forma explícita con
        `PUT /profile`). Nunca bloquea el uso de la app (MASTER_PROMPT §2.3).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParqSubmission" }
      responses:
        "200":
          description: PAR-Q registrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParqResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /body-metrics:
    get:
      tags: [profile]
      operationId: listBodyMetrics
      summary: Métricas corporales (peso, % grasa, cintura), más recientes primero
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de métricas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BodyMetricPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [profile]
      operationId: upsertBodyMetric
      summary: Registra la métrica de un día (sustituye la existente de esa fecha)
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyMetricCreate" }
            example: { date: "2026-09-21", weight_kg: 64.3, body_fat_pct: null, waist_cm: 71.5 }
      responses:
        "200":
          description: Métrica existente de esa fecha sustituida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BodyMetric" }
        "201":
          description: Métrica creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BodyMetric" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /body-metrics/{metric_id}:
    parameters:
      - $ref: "#/components/parameters/MetricId"
    delete:
      tags: [profile]
      operationId: deleteBodyMetric
      summary: Elimina una métrica corporal
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Eliminada.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ----------------------------------------------------------------- catalog
  /exercises:
    get:
      tags: [catalog]
      operationId: listExercises
      summary: Busca y filtra ejercicios
      description: |
        Búsqueda tolerante a acentos en español e inglés (`q`). Los filtros de lista admiten
        varios valores repitiendo el parámetro (`?equipment=dumbbell&equipment=band`): OR
        dentro de un filtro, AND entre filtros. `muscle` casa con el músculo objetivo o con
        los secundarios. Orden: relevancia si hay `q`; si no, `name_es`.
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
          example: sentadilla
        - name: body_part
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/BodyPart" }, uniqueItems: true }
        - name: target
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/MuscleCode" }, uniqueItems: true }
        - name: muscle
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/MuscleCode" }, uniqueItems: true }
        - name: equipment
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/EquipmentCode" }, uniqueItems: true }
        - name: pattern
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/MovementPattern" }, uniqueItems: true }
        - name: mechanic
          in: query
          schema: { $ref: "#/components/schemas/Mechanic" }
        - name: difficulty
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/Difficulty" }, uniqueItems: true }
        - name: role
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/ExerciseRole" }, uniqueItems: true }
        - name: favorites
          in: query
          description: Solo favoritos del usuario.
          schema: { type: boolean, default: false }
        - name: include_deprecated
          in: query
          description: Incluye ejercicios retirados del dataset (marcados `deprecated`).
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Página de ejercicios.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControlPrivate" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExercisePage" }
              example:
                items:
                  - id: "0043"
                    slug: sentadilla-con-barra
                    name_es: sentadilla con barra
                    name_en: barbell full squat
                    variant_label_es: null
                    body_part: upper_legs
                    equipment_code: barbell
                    target_muscle: glutes
                    movement_pattern: squat
                    mechanic: compound
                    role: main
                    difficulty: 2
                    is_staple: true
                    laterality: bilateral
                    load_type: external
                    demo_sex: null
                    variant_group: barbell-full-squat
                    media:
                      thumb_url: /media/thumbs/0043-qXTaZnJ.jpg
                      gif_url: /media/gifs/0043-qXTaZnJ.gif
                      width: 180
                      height: 180
                      attribution: { text: "© Gym visual", url: "https://gymvisual.com/" }
                    is_favorite: true
                    deprecated: false
                next_cursor: "eyJuIjoic2VudGFkaWxsYSBjb24gYmFycmEiLCJpZCI6IjAwNDMifQ"
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /exercises/{exercise_id}:
    parameters:
      - $ref: "#/components/parameters/ExerciseId"
    get:
      tags: [catalog]
      operationId: getExercise
      summary: Detalle de un ejercicio con instrucciones en el idioma pedido
      parameters:
        - name: lang
          in: query
          description: Idioma de las instrucciones; por defecto, el `locale` del usuario.
          schema: { $ref: "#/components/schemas/InstructionLang" }
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Detalle del ejercicio.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControlPrivate" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseDetail" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /exercises/{exercise_id}/alternatives:
    parameters:
      - $ref: "#/components/parameters/ExerciseId"
    get:
      tags: [catalog]
      operationId: listExerciseAlternatives
      summary: Alternativas precalculadas (top 8, MASTER_PROMPT §6.5)
      parameters:
        - name: equipment
          in: query
          description: Restringe a este equipamiento (p. ej. el del perfil del usuario).
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/EquipmentCode" }, uniqueItems: true }
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Alternativas ordenadas por puntuación descendente.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControlPrivate" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseAlternativeList" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /exercises/{exercise_id}/favorite:
    parameters:
      - $ref: "#/components/parameters/ExerciseId"
    put:
      tags: [catalog]
      operationId: addFavoriteExercise
      summary: Marca el ejercicio como favorito (idempotente)
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Es favorito.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [catalog]
      operationId: removeFavoriteExercise
      summary: Quita el ejercicio de favoritos (idempotente)
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Ya no es favorito.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /catalog/facets:
    get:
      tags: [catalog]
      operationId: getCatalogFacets
      summary: Recuentos por valor de cada filtro (acepta los mismos filtros que /exercises)
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: body_part
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/BodyPart" }, uniqueItems: true }
        - name: muscle
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/MuscleCode" }, uniqueItems: true }
        - name: equipment
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/EquipmentCode" }, uniqueItems: true }
        - name: pattern
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/MovementPattern" }, uniqueItems: true }
        - name: favorites
          in: query
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Facetas con recuentos.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControlPrivate" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogFacets" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # --------------------------------------------------------------- generator
  /generator/preview:
    post:
      tags: [generator]
      operationId: previewProgram
      summary: Genera un programa sin persistirlo
      description: |
        Ejecuta `forja_engine.generate`. Misma entrada + misma semilla + misma versión de
        tablas ⇒ mismo `ProgramPlan`. Si `seed` falta, se deriva del hash de la entrada
        normalizada y se devuelve en `plan.seed`.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeneratorInput" }
            example:
              goal: hypertrophy
              days_per_week: 4
              sex: female
              experience: intermediate
              session_minutes: 60
              equipment: { preset: full_gym, items: [] }
              emphasis: lower_glutes
              avoid_muscles: []
              avoid_patterns: []
              preferred_days: [mon, tue, thu, fri]
              weeks: 5
              include_warmup: null
              include_cooldown: null
              include_cardio_finisher: null
              favorite_exercise_ids: ["0043"]
              excluded_exercise_ids: []
              seed: null
      responses:
        "200":
          description: Programa generado y ejercicios referenciados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneratorPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /generator/preview/regenerate-day:
    post:
      tags: [generator]
      operationId: previewRegenerateDay
      summary: Regenera un día de un plan aún no guardado
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreviewRegenerateDayRequest" }
      responses:
        "200":
          description: Plan con el día regenerado en todas las semanas.
          content:
            application/json:
