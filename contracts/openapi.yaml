        movement_pattern: { $ref: "#/components/schemas/MovementPattern" }
        mechanic: { $ref: "#/components/schemas/Mechanic" }
        role: { $ref: "#/components/schemas/ExerciseRole" }
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        is_staple: { type: boolean }
        laterality: { $ref: "#/components/schemas/Laterality" }
        load_type: { $ref: "#/components/schemas/LoadType" }
        demo_sex: { anyOf: [{ $ref: "#/components/schemas/DemoSex" }, { type: "null" }] }
        deprecated: { type: boolean }

    # ============================================================ motor de rutinas
    GeneratorInput:
      type: object
      description: Entrada del motor de rutinas (MASTER_PROMPT §7.1). Ver `contracts/domain.md`.
      required: [goal, days_per_week, sex, experience, session_minutes, equipment]
      additionalProperties: false
      properties:
        goal: { $ref: "#/components/schemas/Goal" }
        days_per_week: { type: integer, minimum: 1, maximum: 7 }
        sex: { $ref: "#/components/schemas/Sex" }
        experience: { $ref: "#/components/schemas/Experience" }
        session_minutes: { type: integer, minimum: 20, maximum: 120, multipleOf: 5 }
        equipment: { $ref: "#/components/schemas/EquipmentSelection" }
        emphasis:
          $ref: "#/components/schemas/Emphasis"
          default: balanced
        avoid_muscles:
          type: array
          uniqueItems: true
          default: []
          items: { $ref: "#/components/schemas/MuscleCode" }
        avoid_patterns:
          type: array
          uniqueItems: true
          default: []
          items: { $ref: "#/components/schemas/MovementPattern" }
        preferred_days:
          type: array
          uniqueItems: true
          maxItems: 7
          default: []
          description: Vacía o con exactamente `days_per_week` elementos.
          items: { $ref: "#/components/schemas/Weekday" }
        weeks: { type: integer, minimum: 4, maximum: 8, default: 5, description: "Incluye la semana final de descarga." }
        include_warmup: { type: [boolean, "null"], default: null, description: "`null` ⇒ valor por defecto según objetivo." }
        include_cooldown: { type: [boolean, "null"], default: null }
        include_cardio_finisher: { type: [boolean, "null"], default: null }
        favorite_exercise_ids:
          type: array
          uniqueItems: true
          maxItems: 200
          default: []
          items: { $ref: "#/components/schemas/ExerciseIdValue" }
        excluded_exercise_ids:
          type: array
          uniqueItems: true
          maxItems: 500
          default: []
          items: { $ref: "#/components/schemas/ExerciseIdValue" }
        seed:
          type: [integer, "null"]
          minimum: 0
          maximum: 9007199254740991
          default: null
          description: "Entero seguro en JavaScript (≤ 2^53−1). `null` ⇒ se deriva del hash de la entrada normalizada."
    SlotRef:
      type: object
      description: Slot del día del split que originó el ejercicio.
      required: [slot_index, pattern, role, group, priority]
      additionalProperties: false
      properties:
        slot_index: { type: integer, minimum: 0 }
        pattern: { $ref: "#/components/schemas/MovementPattern" }
        role: { $ref: "#/components/schemas/ExerciseRole" }
        group: { $ref: "#/components/schemas/MuscleGroup" }
        priority: { type: integer, minimum: 1, maximum: 3 }
    SlotAddress:
      type: object
      description: Posición de un ejercicio dentro de un `ProgramPlan` (índices desde 0).
      required: [week_index, day_index, block_order, exercise_order]
      additionalProperties: false
      properties:
        week_index: { type: integer, minimum: 0 }
        day_index: { type: integer, minimum: 0, maximum: 6 }
        block_order: { type: integer, minimum: 0 }
        exercise_order: { type: integer, minimum: 0 }
    PlanWarning:
      type: object
      required: [code, message_es, week_index, day_index, exercise_id]
      additionalProperties: false
      properties:
        code: { $ref: "#/components/schemas/PlanWarningCode" }
        message_es: { type: string }
        week_index: { type: [integer, "null"], minimum: 0 }
        day_index: { type: [integer, "null"], minimum: 0, maximum: 6 }
        exercise_id: { anyOf: [{ $ref: "#/components/schemas/ExerciseIdValue" }, { type: "null" }] }
    GroupVolume:
      type: object
      description: Series efectivas semanales objetivo y planificadas de un grupo (semana tipo).
      required: [group, target_min, target_max, planned_sets]
      additionalProperties: false
      properties:
        group: { $ref: "#/components/schemas/VolumeGroup" }
        target_min: { type: number, minimum: 0 }
        target_max: { type: number, minimum: 0 }
        planned_sets: { type: number, minimum: 0, description: "Compuestos: 1,0 al objetivo y 0,5 a secundarios relevantes." }
    GroupSets:
      type: object
      required: [group, sets]
      additionalProperties: false
      properties:
        group: { $ref: "#/components/schemas/VolumeGroup" }
        sets: { type: number, minimum: 0, maximum: 10, description: "Máx. 10 series efectivas por grupo y sesión." }
    ExercisePrescription:
      type: object
      description: |
        Prescripción de un ejercicio. Se usa `rep_min`/`rep_max` o `duration_s` (isométricos,
        cardio y estiramientos), nunca ambos a `null`. `per_side` indica que reps o
        duración son por lado. `tempo` = excéntrica-pausa-concéntrica-pausa (`X` = explosiva).
      required: [exercise_id, sets, rep_min, rep_max, duration_s, per_side, target_rir, tempo, rest_s, load_hint, notes_es, alternatives]
      properties:
        exercise_id: { $ref: "#/components/schemas/ExerciseIdValue" }
        sets: { type: integer, minimum: 1, maximum: 10 }
        rep_min: { type: [integer, "null"], minimum: 1, maximum: 100 }
        rep_max: { type: [integer, "null"], minimum: 1, maximum: 100 }
        duration_s: { type: [integer, "null"], minimum: 5, maximum: 3600 }
        per_side: { type: boolean }
        target_rir: { type: [integer, "null"], minimum: 0, maximum: 5 }
        tempo: { type: [string, "null"], pattern: "^[0-9X]-[0-9X]-[0-9X]-[0-9X]$", examples: ["3-0-1-0"] }
        rest_s: { type: integer, minimum: 0, maximum: 600 }
        load_hint: { type: [string, "null"], maxLength: 200, examples: ["Carga que te deje 2 repeticiones en reserva"] }
        notes_es: { type: [string, "null"], maxLength: 500 }
        alternatives:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/ExerciseIdValue" }
    PlanExercise:
      allOf:
        - $ref: "#/components/schemas/ExercisePrescription"
        - type: object
          required: [order, slot]
          properties:
            order: { type: integer, minimum: 0 }
            slot:
              description: "`null` en ejercicios de calentamiento, vuelta a la calma o finisher."
              anyOf: [{ $ref: "#/components/schemas/SlotRef" }, { type: "null" }]
    PlanBlock:
      type: object
      required: [order, kind, rounds, rest_between_rounds_s, exercises]
      properties:
        order: { type: integer, minimum: 0 }
        kind: { $ref: "#/components/schemas/BlockKind" }
        rounds: { type: integer, minimum: 1, maximum: 10 }
        rest_between_rounds_s: { type: [integer, "null"], minimum: 0, maximum: 600 }
        exercises: { type: array, minItems: 1, items: { $ref: "#/components/schemas/PlanExercise" } }
    PlanDay:
      type: object
      required: [index, template, name_es, focus_es, weekday, is_recovery, estimated_minutes, blocks, volume]
      properties:
        index: { type: integer, minimum: 0, maximum: 6 }
        template: { type: string, description: "Clave de `day_templates` en `specs/split-templates.yaml`.", examples: [upper_a] }
        name_es: { type: string, examples: ["Torso A"] }
        focus_es: { type: string, examples: ["Tren superior: empuje y tirón horizontal"] }
        weekday: { anyOf: [{ $ref: "#/components/schemas/Weekday" }, { type: "null" }] }
        is_recovery: { type: boolean, description: "Día de recuperación activa (7 días/semana)." }
        estimated_minutes: { type: integer, minimum: 1, maximum: 240 }
        blocks: { type: array, minItems: 1, items: { $ref: "#/components/schemas/PlanBlock" } }
        volume: { type: array, items: { $ref: "#/components/schemas/GroupSets" } }
    PlanWeek:
      type: object
      required: [index, phase, target_rir, volume_ratio, days]
      properties:
        index: { type: integer, minimum: 0, maximum: 7 }
        phase: { $ref: "#/components/schemas/WeekPhase" }
        target_rir: { type: integer, minimum: 0, maximum: 5, description: "RIR objetivo de referencia de la semana." }
        volume_ratio: { type: number, exclusiveMinimum: 0, maximum: 2, description: "1,0 normal; ≈0,55 en descarga." }
        days: { type: array, minItems: 1, maxItems: 7, items: { $ref: "#/components/schemas/PlanDay" } }
    ProgramPlan:
      type: object
      description: Salida del motor de rutinas (MASTER_PROMPT §7.2 paso 9). Determinista.
      required: [engine_version, tables_hash, seed, input, split, weeks, weekly_volume, warnings, rationale_es]
      properties:
        engine_version: { type: string, examples: ["1.0.0"] }
        tables_hash: { type: string, pattern: "^[0-9a-f]{64}$", description: "SHA-256 de las tablas YAML cargadas." }
        seed: { type: integer, minimum: 0, maximum: 9007199254740991 }
        input: { $ref: "#/components/schemas/GeneratorInput" }
        split:
          type: array
          minItems: 1
          maxItems: 7
          description: Plantillas de día elegidas, en orden.
          items: { type: string }
        weeks: { type: array, minItems: 4, maxItems: 8, items: { $ref: "#/components/schemas/PlanWeek" } }
        weekly_volume: { type: array, items: { $ref: "#/components/schemas/GroupVolume" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/PlanWarning" } }
        rationale_es:
          type: array
          items: { type: string }
          examples: [["Hemos elegido torso/pierna porque entrenas 4 días y tienes experiencia intermedia.", "Hemos dado más volumen a glúteos e isquios por el énfasis elegido."]]
    GeneratorPreview:
      type: object
      required: [plan, exercises]
      properties:
        plan: { $ref: "#/components/schemas/ProgramPlan" }
        exercises:
          type: array
          description: Ejercicios referenciados por el plan (incluidas alternativas), sin repetir.
          items: { $ref: "#/components/schemas/ExerciseSummary" }
    PreviewRegenerateDayRequest:
      type: object
      required: [plan, day_index, seed]
      additionalProperties: false
      properties:
        plan: { $ref: "#/components/schemas/ProgramPlan" }
        day_index: { type: integer, minimum: 0, maximum: 6 }
        seed: { type: [integer, "null"], minimum: 0, maximum: 9007199254740991, description: "`null` ⇒ semilla nueva derivada." }
    PreviewSwapRequest:
      type: object
      required: [plan, address, exclude_ids, replacement_id, apply_to_all_weeks]
      additionalProperties: false
      properties:
        plan: { $ref: "#/components/schemas/ProgramPlan" }
        address: { $ref: "#/components/schemas/SlotAddress" }
        exclude_ids:
          type: array
          uniqueItems: true
          maxItems: 100
          items: { $ref: "#/components/schemas/ExerciseIdValue" }
        replacement_id:
          description: Ejercicio elegido por el usuario; `null` ⇒ el motor elige el mejor candidato.
          anyOf: [{ $ref: "#/components/schemas/ExerciseIdValue" }, { type: "null" }]
        apply_to_all_weeks: { type: boolean, default: true }

    # ============================================================ programas
    ProgramExercise:
      allOf:
        - $ref: "#/components/schemas/ExercisePrescription"
        - type: object
          required: [id, order]
          properties:
            id: { type: string, format: uuid }
            order: { type: integer, minimum: 0 }
    ProgramBlock:
      type: object
      required: [id, order, kind, rounds, rest_between_rounds_s, exercises]
      properties:
        id: { type: string, format: uuid }
        order: { type: integer, minimum: 0 }
        kind: { $ref: "#/components/schemas/BlockKind" }
        rounds: { type: integer, minimum: 1, maximum: 10 }
        rest_between_rounds_s: { type: [integer, "null"], minimum: 0, maximum: 600 }
        exercises: { type: array, minItems: 1, items: { $ref: "#/components/schemas/ProgramExercise" } }
    ProgramDay:
      type: object
      required: [id, index, name, focus, weekday, is_recovery, estimated_minutes, blocks]
      properties:
        id: { type: string, format: uuid }
        index: { type: integer, minimum: 0, maximum: 6 }
        name: { type: string, maxLength: 80 }
        focus: { type: [string, "null"], maxLength: 120 }
        weekday: { anyOf: [{ $ref: "#/components/schemas/Weekday" }, { type: "null" }] }
        is_recovery: { type: boolean }
        estimated_minutes: { type: integer, minimum: 1, maximum: 240 }
        blocks: { type: array, items: { $ref: "#/components/schemas/ProgramBlock" } }
    ProgramWeek:
      type: object
      required: [id, index, phase, days]
      properties:
        id: { type: string, format: uuid }
        index: { type: integer, minimum: 0, maximum: 7 }
        phase: { $ref: "#/components/schemas/WeekPhase" }
        days: { type: array, items: { $ref: "#/components/schemas/ProgramDay" } }
    ProgramSummary:
      type: object
      required: [id, name, source, goal, days_per_week, weeks_count, is_active, archived_at, generator_version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        source: { $ref: "#/components/schemas/ProgramSource" }
        goal: { anyOf: [{ $ref: "#/components/schemas/Goal" }, { type: "null" }] }
        days_per_week: { type: integer, minimum: 1, maximum: 7 }
        weeks_count: { type: integer, minimum: 1, maximum: 8 }
        is_active: { type: boolean }
        archived_at: { type: [string, "null"], format: date-time }
        generator_version: { type: [string, "null"], description: "`ENGINE_VERSION` con el que se generó." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      example:
        id: 0192f09e-0000-7c2d-8e4f-5a6b7c8d9e00
        name: Hipertrofia 4 días · glúteo
        source: generated
        goal: hypertrophy
        days_per_week: 4
        weeks_count: 5
        is_active: true
        archived_at: null
        generator_version: 1.0.0
        created_at: "2026-09-20T10:00:00Z"
        updated_at: "2026-09-20T10:00:00Z"
    ProgramDetail:
      allOf:
        - $ref: "#/components/schemas/ProgramSummary"
        - type: object
          required: [seed, tables_hash, generator_input, weeks, weekly_volume, warnings, rationale_es, exercises]
          properties:
            seed: { type: [integer, "null"], minimum: 0, maximum: 9007199254740991 }
            tables_hash: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
            generator_input: { anyOf: [{ $ref: "#/components/schemas/GeneratorInput" }, { type: "null" }] }
            weeks: { type: array, items: { $ref: "#/components/schemas/ProgramWeek" } }
            weekly_volume: { type: array, items: { $ref: "#/components/schemas/GroupVolume" } }
            warnings: { type: array, items: { $ref: "#/components/schemas/PlanWarning" } }
            rationale_es: { type: array, items: { type: string } }
            exercises:
              type: array
              description: Ejercicios referenciados (incluidas alternativas), sin repetir.
              items: { $ref: "#/components/schemas/ExerciseSummary" }
    ExerciseEdit:
      allOf:
        - $ref: "#/components/schemas/ExercisePrescription"
    BlockEdit:
      type: object
      required: [kind, rounds, rest_between_rounds_s, exercises]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/BlockKind" }
        rounds: { type: integer, minimum: 1, maximum: 10 }
        rest_between_rounds_s: { type: [integer, "null"], minimum: 0, maximum: 600 }
        exercises: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/ExerciseEdit" } }
    DayEdit:
      type: object
      description: Día completo editado (el orden de `blocks` y `exercises` es el orden final).
      required: [name, focus, weekday, blocks, apply_to_all_weeks]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        focus: { type: [string, "null"], maxLength: 120 }
        weekday: { anyOf: [{ $ref: "#/components/schemas/Weekday" }, { type: "null" }] }
        blocks: { type: array, minItems: 1, maxItems: 12, items: { $ref: "#/components/schemas/BlockEdit" } }
        apply_to_all_weeks:
          type: boolean
          default: true
          description: Propaga la estructura al mismo día del resto de semanas (re-periodizado por el motor).
    ProgramCreateFromPlan:
      type: object
      required: [source, name, plan, activate]
      additionalProperties: false
      properties:
        source: { type: string, const: generated }
        name: { type: string, minLength: 1, maxLength: 80 }
        plan: { $ref: "#/components/schemas/ProgramPlan" }
        activate: { type: boolean, default: false }
    ProgramCreateManual:
      type: object
      required: [source, name, goal, weeks, days, activate]
      additionalProperties: false
      properties:
        source: { type: string, const: manual }
        name: { type: string, minLength: 1, maxLength: 80 }
        goal: { anyOf: [{ $ref: "#/components/schemas/Goal" }, { type: "null" }] }
        weeks: { type: integer, minimum: 1, maximum: 8, description: "Número de semanas; la estructura de `days` se repite en todas." }
        days: { type: array, minItems: 1, maxItems: 7, items: { $ref: "#/components/schemas/DayEdit" } }
        activate: { type: boolean, default: false }
    ProgramCreate:
      oneOf:
        - $ref: "#/components/schemas/ProgramCreateFromPlan"
        - $ref: "#/components/schemas/ProgramCreateManual"
      discriminator:
        propertyName: source
        mapping:
          generated: "#/components/schemas/ProgramCreateFromPlan"
          manual: "#/components/schemas/ProgramCreateManual"
    ProgramUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        archived: { type: boolean, description: "`true` archiva (y desactiva); `false` desarchiva." }
    ProgramDuplicateRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: "Por defecto «<nombre> (copia)»." }
    ProgramPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ProgramSummary" } }
        next_cursor: { type: [string, "null"] }
    RegenerateDayRequest:
      type: object
      required: [day_index, seed]
      additionalProperties: false
      description: Solo para programas `generated` (si no, `409` con `code = program_not_generated`).
      properties:
        day_index: { type: integer, minimum: 0, maximum: 6, description: "Índice del día en la semana; se regenera en todas las semanas." }
        seed: { type: [integer, "null"], minimum: 0, maximum: 9007199254740991 }
    SwapRequest:
      type: object
      required: [program_exercise_id, exclude_ids, replacement_id, apply_to_all_weeks]
      additionalProperties: false
      properties:
        program_exercise_id: { type: string, format: uuid }
        exclude_ids:
          type: array
          uniqueItems: true
          maxItems: 100
          items: { $ref: "#/components/schemas/ExerciseIdValue" }
        replacement_id: { anyOf: [{ $ref: "#/components/schemas/ExerciseIdValue" }, { type: "null" }] }
        apply_to_all_weeks: { type: boolean, default: true }

    # ============================================================ sesiones
    WorkoutSessionCreate:
      type: object
      required: [client_uuid, program_day_id, started_at]
      additionalProperties: false
      properties:
        client_uuid: { type: string, format: uuid, description: "Generado en el cliente (idempotencia offline)." }
        program_day_id: { type: [string, "null"], format: uuid, description: "`null` ⇒ sesión libre." }
        name: { type: [string, "null"], maxLength: 80, description: "Por defecto, el nombre del día o «Sesión libre»." }
        started_at: { type: string, format: date-time }
        notes: { type: [string, "null"], maxLength: 2000 }
    WorkoutSessionUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        notes: { type: [string, "null"], maxLength: 2000 }
        perceived_effort: { type: [integer, "null"], minimum: 1, maximum: 10 }
        status: { type: string, const: abandoned, description: "Solo se puede pasar a `abandoned`; para terminar, `/finish`." }
    SetLogCreate:
      type: object
      description: Serie registrada; al menos `reps` o `duration_s`.
      required: [client_uuid, exercise_id, program_exercise_id, set_index, weight_kg, reps, rir, duration_s, is_warmup, completed_at]
      additionalProperties: false
      properties:
        client_uuid: { type: string, format: uuid }
        exercise_id: { $ref: "#/components/schemas/ExerciseIdValue" }
        program_exercise_id: { type: [string, "null"], format: uuid }
        set_index: { type: integer, minimum: 1, maximum: 50 }
        weight_kg: { type: [number, "null"], minimum: 0, maximum: 1000, description: "Siempre en kg (el cliente convierte si `units = imperial`)." }
        reps: { type: [integer, "null"], minimum: 0, maximum: 200 }
        rir: { type: [integer, "null"], minimum: 0, maximum: 10 }
        duration_s: { type: [integer, "null"], minimum: 1, maximum: 7200 }
        is_warmup: { type: boolean }
        completed_at: { type: string, format: date-time }
    SetLogUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        weight_kg: { type: [number, "null"], minimum: 0, maximum: 1000 }
        reps: { type: [integer, "null"], minimum: 0, maximum: 200 }
        rir: { type: [integer, "null"], minimum: 0, maximum: 10 }
        duration_s: { type: [integer, "null"], minimum: 1, maximum: 7200 }
        is_warmup: { type: boolean }
    SetLog:
      type: object
      required: [id, client_uuid, session_id, exercise_id, program_exercise_id, set_index, weight_kg, reps, rir, duration_s, is_warmup, completed_at, updated_at, records]
      properties:
        id: { type: string, format: uuid }
        client_uuid: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        exercise_id: { $ref: "#/components/schemas/ExerciseIdValue" }
        program_exercise_id: { type: [string, "null"], format: uuid }
        set_index: { type: integer, minimum: 1 }
        weight_kg: { type: [number, "null"] }
        reps: { type: [integer, "null"] }
        rir: { type: [integer, "null"] }
        duration_s: { type: [integer, "null"] }
        is_warmup: { type: boolean }
        completed_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        records:
          type: array
          description: Récords personales que ha batido esta serie (para el confeti discreto).
          items: { $ref: "#/components/schemas/RecordKind" }
      example:
        id: 0192f0a6-9999-7d4e-8f60-718293a4b5c7
        client_uuid: 0192f0a6-0b2c-7d4e-8f60-718293a4b5c6
        session_id: 0192f0a4-8888-7b3a-9d51-2f6c1e8a4b11
        exercise_id: "0043"
        program_exercise_id: 0192f09e-2b3c-7d4e-9f60-a1b2c3d4e5f6
        set_index: 1
        weight_kg: 62.5
        reps: 8
        rir: 2
        duration_s: null
        is_warmup: false
        completed_at: "2026-09-22T17:14:30Z"
        updated_at: "2026-09-22T17:14:31Z"
        records: [e1rm]
    WorkoutSessionSummary:
      type: object
      required: [id, client_uuid, program_id, program_day_id, name, started_at, finished_at, status, perceived_effort, notes, set_count, volume_kg, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        client_uuid: { type: string, format: uuid }
        program_id: { type: [string, "null"], format: uuid }
        program_day_id: { type: [string, "null"], format: uuid }
        name: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        status: { $ref: "#/components/schemas/SessionStatus" }
        perceived_effort: { type: [integer, "null"], minimum: 1, maximum: 10 }
