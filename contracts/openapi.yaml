    SyncSessionUpsert:
      type: object
      required: [op, client_uuid, program_day_id, name, started_at, finished_at, status, perceived_effort, notes, updated_at]
      additionalProperties: false
      properties:
        op: { type: string, const: session_upsert }
        client_uuid: { type: string, format: uuid }
        program_day_id: { type: [string, "null"], format: uuid }
        name: { type: [string, "null"], maxLength: 80 }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        status: { $ref: "#/components/schemas/SessionStatus" }
        perceived_effort: { type: [integer, "null"], minimum: 1, maximum: 10 }
        notes: { type: [string, "null"], maxLength: 2000 }
        updated_at: { type: string, format: date-time, description: "Marca del cliente para «última escritura gana»." }
    SyncSetUpsert:
      type: object
      required: [op, session_client_uuid, set, updated_at]
      additionalProperties: false
      properties:
        op: { type: string, const: set_upsert }
        session_client_uuid: { type: string, format: uuid }
        set: { $ref: "#/components/schemas/SetLogCreate" }
        updated_at: { type: string, format: date-time }
    SyncSetDelete:
      type: object
      required: [op, client_uuid, deleted_at]
      additionalProperties: false
      properties:
        op: { type: string, const: set_delete }
        client_uuid: { type: string, format: uuid, description: "`client_uuid` de la serie." }
        deleted_at: { type: string, format: date-time }
    SyncOperation:
      oneOf:
        - $ref: "#/components/schemas/SyncSessionUpsert"
        - $ref: "#/components/schemas/SyncSetUpsert"
        - $ref: "#/components/schemas/SyncSetDelete"
      discriminator:
        propertyName: op
        mapping:
          session_upsert: "#/components/schemas/SyncSessionUpsert"
          set_upsert: "#/components/schemas/SyncSetUpsert"
          set_delete: "#/components/schemas/SyncSetDelete"
    SyncRequest:
      type: object
      required: [operations]
      additionalProperties: false
      properties:
        operations: { type: array, minItems: 1, maxItems: 500, items: { $ref: "#/components/schemas/SyncOperation" } }
    SyncResult:
      type: object
      required: [index, op, client_uuid, status, server_id, problem]
      properties:
        index: { type: integer, minimum: 0, description: "Posición de la operación en el lote." }
        op: { type: string, enum: [session_upsert, set_upsert, set_delete] }
        client_uuid: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/SyncResultStatus" }
        server_id: { type: [string, "null"], format: uuid }
        problem: { anyOf: [{ $ref: "#/components/schemas/Problem" }, { type: "null" }] }
    SyncResponse:
      type: object
      required: [server_time, results]
      properties:
        server_time: { type: string, format: date-time }
        results: { type: array, items: { $ref: "#/components/schemas/SyncResult" } }
    SetPerformance:
      type: object
      required: [weight_kg, reps, rir, duration_s]
      properties:
        weight_kg: { type: [number, "null"] }
        reps: { type: [integer, "null"] }
        rir: { type: [integer, "null"] }
        duration_s: { type: [integer, "null"] }
    LastPerformance:
      type: object
      required: [session_id, date, sets]
      properties:
        session_id: { type: string, format: uuid }
        date: { type: string, format: date }
        sets: { type: array, items: { $ref: "#/components/schemas/SetPerformance" } }
    WarmupSet:
      type: object
      description: "Serie de aproximación (40 %×8, 60 %×5, 80 %×2) redondeada a la carga disponible."
      required: [percent, reps, weight_kg, plates_per_side_kg]
      properties:
        percent: { type: number, exclusiveMinimum: 0, maximum: 1 }
        reps: { type: integer, minimum: 1 }
        weight_kg: { type: number, minimum: 0 }
        plates_per_side_kg: { type: array, items: { type: number }, description: "Discos por lado sobre barra de 20 kg (vacío si no aplica)." }
    LoadSuggestion:
      type: object
      description: Sugerencia de progresión (§7.6); puramente informativa, el usuario confirma.
      required: [program_exercise_id, exercise_id, kind, suggested_weight_kg, suggested_rep_min, suggested_rep_max, suggested_exercise_id, plates_per_side_kg, reason_es, last_performance, warmup_sets]
      properties:
        program_exercise_id: { type: string, format: uuid }
        exercise_id: { $ref: "#/components/schemas/ExerciseIdValue" }
        kind: { $ref: "#/components/schemas/SuggestionKind" }
        suggested_weight_kg: { type: [number, "null"], minimum: 0 }
        suggested_rep_min: { type: [integer, "null"], minimum: 1 }
        suggested_rep_max: { type: [integer, "null"], minimum: 1 }
        suggested_exercise_id:
          description: Variante más difícil del mismo patrón (solo con `harder_variant`).
          anyOf: [{ $ref: "#/components/schemas/ExerciseIdValue" }, { type: "null" }]
        plates_per_side_kg: { type: array, items: { type: number } }
        reason_es: { type: string, examples: ["Completaste todas las series en el tope del rango: sube 2,5 kg."] }
        last_performance: { anyOf: [{ $ref: "#/components/schemas/LastPerformance" }, { type: "null" }] }
        warmup_sets: { type: array, items: { $ref: "#/components/schemas/WarmupSet" } }
    NextSession:
      type: object
      required: [status, program_id, program_name, week_index, day, scheduled_date, suggestions, exercises]
      properties:
        status:
          type: string
          enum: [scheduled, rest_day, no_active_program, program_completed]
        program_id: { type: [string, "null"], format: uuid }
        program_name: { type: [string, "null"] }
        week_index: { type: [integer, "null"], minimum: 0 }
        day: { anyOf: [{ $ref: "#/components/schemas/ProgramDay" }, { type: "null" }] }
        scheduled_date: { type: [string, "null"], format: date }
        suggestions: { type: array, items: { $ref: "#/components/schemas/LoadSuggestion" } }
        exercises: { type: array, items: { $ref: "#/components/schemas/ExerciseSummary" } }

    # ============================================================ progreso
    PersonalRecord:
      type: object
