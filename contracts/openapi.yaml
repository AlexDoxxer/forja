    # ============================================================ nutrición
    MacroTotals:
      type: object
      required: [kcal, protein_g, fat_g, carbs_g, fiber_g]
      additionalProperties: false
      properties:
        kcal: { type: number, minimum: 0 }
        protein_g: { type: number, minimum: 0 }
        fat_g: { type: number, minimum: 0 }
        carbs_g: { type: number, minimum: 0 }
        fiber_g: { type: number, minimum: 0 }
    NutritionBlock:
      type: object
      required: [reason_code, message_es]
      additionalProperties: false
      properties:
        reason_code: { $ref: "#/components/schemas/NutritionBlockReason" }
        message_es:
          type: string
          examples: ["No generamos planes de alimentación durante el embarazo o la lactancia. Consulta con un dietista-nutricionista o con tu profesional sanitario."]
    NutritionNotice:
      type: object
      required: [code, message_es]
      additionalProperties: false
      properties:
        code: { $ref: "#/components/schemas/NutritionNoticeCode" }
        message_es: { type: string }
    NutritionInput:
      type: object
      description: |
        Entrada del motor de nutrición (MASTER_PROMPT §8.1). DTO interno: lo construye el
        backend a partir del perfil, la última métrica corporal, el programa activo y los
        ajustes de dieta; no lo recibe ningún endpoint. Ver `contracts/domain.md`.
      required: [sex, age_years, height_cm, weight_kg, activity_level, training_days_per_week, goal, pace, diet_type, meals_per_day, allergens, excluded_food_ids, disliked_food_ids, pregnant, breastfeeding, seed]
      additionalProperties: false
      properties:
        sex: { $ref: "#/components/schemas/Sex" }
        age_years: { type: integer, minimum: 0, maximum: 120 }
        height_cm: { type: number, minimum: 100, maximum: 250 }
        weight_kg: { type: number, minimum: 20, maximum: 400 }
        activity_level: { $ref: "#/components/schemas/ActivityLevel" }
        training_days_per_week: { type: integer, minimum: 0, maximum: 7 }
        goal: { $ref: "#/components/schemas/NutritionGoal" }
        pace: { $ref: "#/components/schemas/NutritionPace" }
        diet_type: { $ref: "#/components/schemas/DietType" }
        meals_per_day: { type: integer, minimum: 3, maximum: 5 }
        allergens: { type: array, uniqueItems: true, items: { $ref: "#/components/schemas/Allergen" } }
        excluded_food_ids: { type: array, uniqueItems: true, items: { $ref: "#/components/schemas/FoodId" } }
        disliked_food_ids: { type: array, uniqueItems: true, items: { $ref: "#/components/schemas/FoodId" } }
        pregnant: { type: boolean }
        breastfeeding: { type: boolean }
        seed: { type: [integer, "null"], minimum: 0, maximum: 9007199254740991 }
    NutritionTarget:
      type: object
      description: Objetivo diario calculado por el motor (§8.2) con suelos de seguridad aplicados (§8.5).
      required: [method, age_years, bmr_kcal, activity_factor, tdee_kcal, requested_goal, effective_goal, pace, target_kcal, protein_g, fat_g, carbs_g, fiber_g, blocked, block, notices]
      properties:
        method: { $ref: "#/components/schemas/BmrMethod" }
        age_years: { type: integer, minimum: 0 }
        bmr_kcal: { type: number, minimum: 0 }
        activity_factor: { type: number, minimum: 1, maximum: 1.9 }
        tdee_kcal: { type: number, minimum: 0 }
        requested_goal: { $ref: "#/components/schemas/NutritionGoal" }
        effective_goal:
          description: Puede diferir del pedido (p. ej. `lose` bloqueado por IMC < 18,5 ⇒ `maintain`).
          $ref: "#/components/schemas/NutritionGoal"
        pace: { $ref: "#/components/schemas/NutritionPace" }
        target_kcal: { type: [number, "null"], minimum: 0, description: "`null` si `blocked`." }
        protein_g: { type: [number, "null"], minimum: 0 }
        fat_g: { type: [number, "null"], minimum: 0 }
        carbs_g: { type: [number, "null"], minimum: 0 }
        fiber_g: { type: [number, "null"], minimum: 0 }
        blocked: { type: boolean }
        block: { anyOf: [{ $ref: "#/components/schemas/NutritionBlock" }, { type: "null" }] }
        notices: { type: array, items: { $ref: "#/components/schemas/NutritionNotice" } }
    NutritionTargetRecord:
      type: object
      required: [id, calculated_at, target]
      properties:
        id: { type: string, format: uuid }
        calculated_at: { type: string, format: date-time }
        target: { $ref: "#/components/schemas/NutritionTarget" }
      example:
        id: 0192f0c1-2222-7b3c-8d4e-5f6071829304
        calculated_at: "2026-09-22T19:00:00Z"
        target:
          method: mifflin_female
          age_years: 35
          bmr_kcal: 1377.5
          activity_factor: 1.65
          tdee_kcal: 2272.9
          requested_goal: lose
          effective_goal: lose
          pace: standard
          target_kcal: 1932
          protein_g: 135
          fat_g: 58
          carbs_g: 218
          fiber_g: 27
          blocked: false
          block: null
          notices:
            - { code: health_disclaimer, message_es: "Estas cifras son orientativas y no sustituyen el consejo de un profesional sanitario." }
    NutritionTargetRequest:
      type: object
      additionalProperties: false
      description: Campos opcionales que sustituyen a los del perfil/ajustes solo para este cálculo.
      properties:
        weight_kg: { type: number, minimum: 20, maximum: 400 }
        goal: { $ref: "#/components/schemas/NutritionGoal" }
        pace: { $ref: "#/components/schemas/NutritionPace" }
    NutritionSettingsFields:
      description: Campos editables de los ajustes de dieta.
      type: object
      required: [diet_enabled, goal, pace, diet_type, meals_per_day, allergens, excluded_food_ids, disliked_food_ids, pregnant, breastfeeding]
      properties:
        diet_enabled: { type: boolean }
        goal: { $ref: "#/components/schemas/NutritionGoal" }
        pace: { $ref: "#/components/schemas/NutritionPace" }
        diet_type: { $ref: "#/components/schemas/DietType" }
        meals_per_day: { type: integer, minimum: 3, maximum: 5 }
        allergens: { type: array, uniqueItems: true, items: { $ref: "#/components/schemas/Allergen" } }
        excluded_food_ids: { type: array, uniqueItems: true, maxItems: 200, items: { $ref: "#/components/schemas/FoodId" } }
        disliked_food_ids: { type: array, uniqueItems: true, maxItems: 200, items: { $ref: "#/components/schemas/FoodId" } }
        pregnant: { type: boolean, description: "Dato sensible; bloquea la generación de planes." }
        breastfeeding: { type: boolean, description: "Dato sensible; bloquea la generación de planes." }
    NutritionSettingsUpdate:
