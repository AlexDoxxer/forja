[project]
name = "forja-engine"
version = "0.2.0"
description = "Motor de generación de rutinas de Forja: puro, determinista y sin E/S."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "pydantic>=2.9,<3",
  "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
  "hypothesis>=6.112",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-benchmark>=4.0",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forja_engine"]

[tool.ruff]
extend = "../ruff.toml"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["forja_engine", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--cov=forja_engine",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=json:coverage.json",
]
markers = ["slow: pruebas lentas (catálogo completo, 1.890 combinaciones)"]

[tool.coverage.run]
branch = true
source = ["forja_engine"]

[tool.coverage.report]
# Umbral combinado (líneas+ramas). El umbral exacto de §2.2 (100 % líneas, >= 95 % ramas)
# lo aplica scripts/coverage_gate.py en `make test` y en CI.
fail_under = 95
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "@overload"]
