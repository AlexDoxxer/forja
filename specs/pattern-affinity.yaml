# Patrones sustitutos en orden de preferencia cuando no hay candidatos para un slot.
version: 1
affinity:
  squat: [lunge, knee_extension]
  lunge: [squat, glute_isolation]
  hinge: [glute_isolation, knee_flexion]
  horizontal_push: [vertical_push, chest_fly]
  vertical_push: [horizontal_push, shoulder_raise]
  horizontal_pull: [vertical_pull, rear_delt]
  vertical_pull: [horizontal_pull]
  elbow_flexion: [horizontal_pull]
  elbow_extension: [horizontal_push]
  shoulder_raise: [vertical_push]
  chest_fly: [horizontal_push]
  rear_delt: [horizontal_pull]
  knee_extension: [squat, lunge]
  knee_flexion: [hinge]
  hip_abduction: [glute_isolation]
  hip_adduction: [lunge]
  glute_isolation: [hinge, lunge]
  calf: []
  core_flexion: [core_anti_extension, core_rotation]
  core_anti_extension: [core_flexion, core_lateral]
  core_rotation: [core_lateral, core_flexion]
  core_lateral: [core_rotation, core_anti_extension]
  shrug: [horizontal_pull]
  carry: [core_lateral]
  plyometric: [squat, lunge]
  cardio: [plyometric]
  mobility: []
