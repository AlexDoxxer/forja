# Prescripción por objetivo x rol. Valores [min, max]. Tempo: excéntrica-pausa-concéntrica-pausa.
version: 1
table:
  strength:
    main:      { sets: [4, 5], reps: [3, 6],   rir: [1, 3], rest_s: [180, 300], tempo: "2-1-X-0" }
    accessory: { sets: [3, 3], reps: [6, 10],  rir: [2, 2], rest_s: [90, 120],  tempo: "2-0-1-0" }
  hypertrophy:
    main:      { sets: [3, 4], reps: [6, 10],  rir: [1, 2], rest_s: [120, 180], tempo: "3-0-1-0" }
    accessory: { sets: [3, 3], reps: [10, 15], rir: [1, 2], rest_s: [60, 90],   tempo: "2-0-1-1" }
  fat_loss:
    main:      { sets: [3, 3], reps: [8, 12],  rir: [2, 2], rest_s: [90, 120],  tempo: "2-0-1-0" }
    accessory: { sets: [2, 3], reps: [12, 15], rir: [2, 2], rest_s: [45, 75],   tempo: "2-0-1-0", prefer_supersets: true }
  toning:
    main:      { sets: [3, 3], reps: [8, 12],  rir: [2, 2], rest_s: [90, 120],  tempo: "2-0-1-0" }
    accessory: { sets: [2, 3], reps: [12, 15], rir: [2, 2], rest_s: [45, 75],   tempo: "2-0-1-0", prefer_supersets: true }
  endurance:
    main:      { sets: [2, 3], reps: [15, 25], rir: [2, 3], rest_s: [30, 60],   tempo: "1-0-1-0", format: circuit }
    accessory: { sets: [2, 3], reps: [15, 25], rir: [2, 3], rest_s: [30, 60],   tempo: "1-0-1-0", format: circuit }
  general_fitness:
    main:      { sets: [3, 3], reps: [8, 12],  rir: [3, 3], rest_s: [90, 120],  tempo: "2-0-1-0" }
    accessory: { sets: [2, 3], reps: [10, 15], rir: [2, 3], rest_s: [60, 90],   tempo: "2-0-1-0" }
common:
  core:     { sets: [2, 3], reps: [10, 20], hold_s: [20, 45], rir: [2, 2], rest_s: [45, 60] }
  warmup:   { sets: [1, 2], reps: [8, 12],  hold_s: [30, 60], rest_s: [0, 30] }
  cooldown: { sets: [1, 2], hold_s: [30, 45], per_side: true, rest_s: [0, 0] }
  cardio_finisher: { minutes: [10, 15], intensity_es: "moderada, puedes hablar con frases cortas" }
experience_adjustments:
  beginner:     { rir_delta: 1, sets: min }
  intermediate: { rir_delta: 0, sets: mid }
  advanced:     { rir_delta: 0, sets: max }
min_rest_s: { main: 90, accessory: 30, core: 30 }
# C9: dominadas, fondos y flexiones en pino con peso corporal: techo 12 y suelo 5 repeticiones.
bodyweight_rep_limits:
  name_en_any: ["pull-up", "pull up", "chin-up", "chin up", "dip", "handstand push-up"]
  min: 5
  max: 12
time_model:
  seconds_per_rep: 3.5          # ajustado por tempo si se especifica
  transition_s: 60
  superset_transition_s: 30
  warmup_minutes: 6
  cooldown_minutes: 5
  budget_tolerance: 0.05
