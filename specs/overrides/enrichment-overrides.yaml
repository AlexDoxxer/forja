  "0020": "Tabla de equilibrio: trabajo propioceptivo sin patrón de fuerza; se usa como calentamiento."
  "0216": "Rotación interna de hombro (manguito rotador): prehabilitación, sin patrón de §6.3."
  "0235": "Rotación externa de hombro (manguito rotador): prehabilitación, sin patrón de §6.3."
  "0863": "Rotación externa de hombro tumbado (manguito rotador): prehabilitación."
  "0864": "Rotación externa de hombro de pie (manguito rotador): prehabilitación."
  "0984": "Rotación interna de cadera con banda: prehabilitación de rotadores de cadera."
  "0996": "Rotación interna de cadera sentado con banda: prehabilitación de rotadores de cadera."
  "0551": "Levantamiento turco: movimiento global en varias fases (suelo-de pie) sin patrón único."

