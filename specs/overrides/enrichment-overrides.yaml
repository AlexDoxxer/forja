# Overrides de enriquecimiento (prevalecen sobre specs/enrichment-rules.yaml). Revisados por
# experto-entrenamiento. Propiedad de ingesta-datos (ADR 0002).
#
# Secciones:
# - pattern_rules: reglas que se evalúan ANTES de las reglas base (misma semántica: AND entre
#   condiciones, OR dentro de cada lista; `name_none` excluye). Las palabras clave se buscan en
#   el nombre visible (erratas corregidas, sin sufijos de variante) en minúsculas y rodeado de
#   un espacio: un espacio en la palabra clave actúa como límite de palabra.
# - keywords: listas que complementan dificultad, lateralidad, tipo de carga, mecánica y rol
#   de calentamiento (warmup_name_any: movilidad dinámica y cardio ligero, §6.3).
# - other_justified: ejercicios que conservan el patrón `other`, con su motivo.
# - difficulty_rules: reglas de dificultad condicionales (name_any / name_none / equipment).
# - by_id: overrides por id. Campos: movement_pattern, mechanic, role, difficulty,
#   laterality, load_type, is_staple, equipment_code (código de equipamiento forzado; el grupo
#   se deriva de equipment-normalization.yaml).
version: 3

pattern_rules:
  # Estiramientos antes que cualquier otra regla prioritaria («outstretched» no casa).
  - { pattern: mobility, name_any: [" stretch"] }
  # Rodillo de muñeca (la regla base de movilidad casa con «roller »).
  - { pattern: forearm, name_any: ["wrist roller"] }
  # Puentes de glúteo antes de la regla de movilidad («outstretched» contiene «stretch»).
  - { pattern: glute_isolation, name_any: ["bridge"], target: [glutes] }
  # Anti-extensión con rueda/barra/rodillo (el dataset escribe «rollerout»).
  - { pattern: core_anti_extension, name_any: ["rollerout", "rollout", "roll out", "fallout", "body saw"] }
  # Pliometría de tren inferior (antes de sentadilla/zancada) y lanzamientos con balón.
  - pattern: plyometric
    name_any: ["jump squat", "squat jump", "plyo squat", "drop jump", "lunge with jump", "jump step", "box jump", "forward jump", "backward jump"]
    name_none: ["push"]
    body_part: ["upper legs", "lower legs"]
  - { pattern: plyometric, name_any: ["throw", " slam", "chest pass", "chest push"], equipment: ["medicine ball"] }
  # Envión, push press y thruster: empuje vertical; cargadas y arrancadas: bisagra.
  - { pattern: vertical_push, name_any: [" jerk", "push press", "thruster", "handstand"] }
  - pattern: hinge
    name_any: [" clean ", " clean and", " snatch", "tire flip"]
    name_none: ["clean-grip", "clean grip"]
  # Press con objetivo deltoides = empuje vertical (incluye «behind neck press», «bradford»).
  - pattern: vertical_push
    name_any: [" press"]
    target: [delts]
    name_none: ["cuban", "w-press", "bench press", "floor press"]
  - { pattern: shoulder_raise, name_any: ["upright row"] }
  - pattern: rear_delt
    name_any: ["rear delt", "rear fly", "rear lateral", "deltoid rear", "reverse fly", "y-raise"]
    name_none: ["plank"]
  - { pattern: horizontal_pull, name_any: [" row"], target: [upper back, lats], name_none: ["upright"] }
  - { pattern: elbow_flexion, name_any: [" curl"], target: [biceps] }
  - { pattern: elbow_extension, name_any: ["triceps extension", "tricep extension"], target: [triceps] }
  - { pattern: horizontal_push, name_any: [" dip"], target: [pectorals] }
  - pattern: core_flexion
    name_any: ["leg raise", "knee raise", "leg hip raise", "leg-hip raise"]
    target: [abs]
    name_none: ["oblique", "twist"]
  - pattern: core_lateral
    name_any: ["side plank", "side bridge", "side crunch", "heel touch", "windmill", " flag ", "bent press"]
    target: [abs, upper back]
  - pattern: core_rotation
    name_any: ["judo flip", "standing lift", "figure 8", "landmine 180", "spell caster", "sledge hammer", "air bike", "bicycle"]
    target: [abs]
  - pattern: core_anti_extension
    name_any: ["planche", "maltese", "front lever ", "shoulder tap", "mountain climber"]
    target: [abs]
  - { pattern: core_flexion, name_any: ["l-sit", "v-sit", "skin the cat"] }
  - pattern: chest_fly
    name_any: ["cross-over", "crossover", "pullover", "svend", "squeeze", "lateral bent-over"]
    target: [pectorals]
  - { pattern: cardio, equipment: ["upper body ergometer", "skierg machine"] }
  - { pattern: cardio, name_any: ["battling ropes", "boxing", "quick feet"] }
  - pattern: mobility
    name_any: [" pose", "sphinx", "upward facing dog", "pelvic tilt", "toe touch", "inchworm", "overhead reach", "wrist circles", "ankle circles", "knees to chest"]
    name_none: ["bridge", "crunch", "crab"]
  - { pattern: squat, name_any: ["leg press", "leg wide press", "wall sit", "march sit"], name_none: ["calf"] }
  - { pattern: hinge, name_any: ["back extension", "hyperextension", "good morning"] }
  - { pattern: shoulder_raise, name_any: ["shoulder raise"], target: [serratus anterior] }
  - { pattern: hip_abduction, name_any: ["monster walk"] }

# Dominadas y fondos estrictos con peso corporal son de nivel intermedio-avanzado (F1b, C10).
difficulty_rules:
  - difficulty: 3
    name_any: ["pull-up", "chin-up", "chin up", " dip"]
    name_none: ["assisted", "band", "negative", "kneeling", "inverted", "bench", "on floor", "between benches", "bench leg", "machine", "floor"]
    equipment: ["body weight"]

keywords:
  difficulty_level_1_any: ["kneeling push", "(on knees)", "with support", "supported", "incline push-up", "(wall)"]
  difficulty_level_3_any:
    ["muscle-up", "one arm chin", "one hand pull", "l-sit", "v-sit", "skin the cat", " flag ", "stalder", "clap push", "plyo push", "depth jump", "drop push", "turkish get up", "overhead squat", "one leg squat", "single leg squat", "gironda", "korean dips", "elbow dips", "hindu push", "superman push", "spider crawl"]
  difficulty_level_1_equipment: ["leverage machine", "cable", "smith machine", "sled machine", "assisted", "band", "resistance band"]
  laterality_unilateral_any: ["one hand", "single-arm", "one-arm", "stork stance", "contralateral", "pistol", "cossack", "curtsey", "step up", "renegade", "one legged"]
  laterality_bilateral_any: []
  time_any: ["l-sit", "v-sit", "planche", "front lever ", "back lever", "maltese", " flag ", "isometric", "handstand ", "march sit", "balance board", "circles"]
  time_none: ["hanging", "hang clean", "hang position", "walking lunge", "walking high knees", "plank tap", "push-up to side plank", "plank with twist", "plank with leg lift", "plank with rear fly", " reps", "monster walk"]
  isolation_name_any: ["pullover", "straight arm", "french press", "skull"]
  isolation_name_none: []
  warmup_name_any:
    [" toe touch", " circles", "inchworm", "overhead reach", "dynamic chest stretch", "half knee bends", "jack jump", "star jump", "high knee against wall", "world greatest stretch", "balance board", "standing archer", "arm slingers"]

