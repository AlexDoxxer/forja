# Glosario obligatorio EN -> ES para traducir los 1.324 nombres. Consistencia > literalidad.
version: 1
style:
  - "Minúscula inicial salvo nombres propios; el frontend capitaliza la primera letra."
  - "Orden: movimiento + implemento + variante (p. ej. 'curl de bíceps con mancuerna, sentado')."
  - "Mantener anglicismos asentados en gimnasios españoles: curl, press, hip thrust, crunch, burpee, kettlebell."
  - "No traducir (male)/(female)/(back pov)/(side pov)/v. 2: se retiran y se gestionan como variante."
