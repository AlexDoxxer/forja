# Configuración compartida de Ruff para todos los paquetes Python de Forja.
# Cada paquete la extiende desde su pyproject.toml (`[tool.ruff] extend = "../ruff.toml"`).
target-version = "py312"
line-length = 100

[lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PT", "RET",
  "ARG", "PTH", "PL", "TID", "TCH", "ERA", "DTZ", "T20", "ASYNC", "PERF", "FBT",
]
ignore = [
  "PLR0913",  # los DTOs y servicios reciben muchos argumentos con nombre de forma legítima
]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "FBT001"]
"**/test_*.py" = ["S101", "PLR2004", "FBT001"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[format]
quote-style = "double"
